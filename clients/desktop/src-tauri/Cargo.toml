[package]
name = "mimir-desktop"
version = "0.1.0"
description = "Mimir desktop GUI — thin brain client"
authors = ["heim"]
edition = "2021"

[lib]
name = "mimir_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "process"] }
keyring = { version = "3", features = ["windows-native"] }
url = "2"
bytes = "1"
thiserror = "2"
arboard = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
