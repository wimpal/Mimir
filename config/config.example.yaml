# Mimir non-secret configuration.
#
# Copy to config/config.yaml and adjust (that copy is gitignored).
# Precedence: MIMIR_* environment variables override this file;
# secrets (Jellyfin API key, auth token, Calendar ICS URL) come from .env / environment only.

ollama:
  url: http://127.0.0.1:11434
  model: qwen3:8b
  # Set explicitly — Ollama's default is often smaller and silently truncates
  # system + history + tool schemas + results (looks like "forgot" / dropped tools).
  num_ctx: 8192
  # Qwen3 hybrid thinking: off for tool loops and voice (latency + formatting).
  think: false

location:
  # Home coords for get_weather (Open-Meteo → KNMI HARMONIE for NL).
  # Example: Utrecht — replace with your own, or set MIMIR_LATITUDE /
  # MIMIR_LONGITUDE / MIMIR_TIMEZONE.
  latitude: 52.09
  longitude: 5.12
  timezone: Europe/Amsterdam

jellyfin:
  url: http://127.0.0.1:8096
  # api_key comes from .env (JELLYFIN_API_KEY).
  user_id: ""  # Jellyfin user GUID for watch state
  library_ids: []  # allowlisted movie library GUIDs only
  sync_interval_hours: 24  # 0 = periodic Sync off (on-demand still works)
  page_size: 100
  recent_watched_days: 14  # Recent watches window for list tool + rec bias

auth:
  # none | token — token required when runtime.host is not loopback (ADR 0005).
  # Secret: MIMIR_CLIENT_TOKEN in .env (MIMIR_AUTH_TOKEN deprecated). Clients send Authorization: Bearer …
  mode: none

agent:
  max_iterations: 3
  system_prompt_path: config/system_prompt.md

timeouts:
  ollama_s: 120
  # Enforced when tools become I/O-bound (Phase 3+).
  tool_s: 30
  # Overall wall-clock budget for one /v1/chat turn.
  turn_s: 180
  # Overall wall-clock budget for one Jellyfin Catalogue Sync.
  jellyfin_sync_s: 300
  # MCP tool calls (contracts/mimir.client.md).
  mcp_default_s: 10
  mcp_search_s: 30

weather:
  # Forecast cache TTL (seconds). Serve last success marked stale when API fails.
  cache_ttl_s: 3600

calendar:
  # Named feeds (id + display name). Optional context: short note for the LLM
  # about what the calendar is (work vs family, whose it is, etc.).
  # ICS URLs are secrets in .env:
  #   CALENDAR_ICS_URL_<ID>  (ID uppercased, hyphens → underscores)
  # Optional per-feed basic auth: CALENDAR_ICS_USERNAME_<ID> / _PASSWORD_<ID>
  # Legacy single feed still works via CALENDAR_ICS_URL (no feeds list).
  cache_ttl_s: 300
  feeds: []
  # Example:
  # feeds:
  #   - id: family
  #     name: Fam Palland
  #     context: Shared household / family schedule
  #   - id: work
  #     name: Work
  #     context: Photographer and videographer client shoots and jobs

memory:
  # Last N user+assistant pairs injected from SQLite (full history retained).
  history_pairs: 20

# MCP services Mimir consumes (mirrors project-control-heim/registry.yaml).
# Bearer token per service in .env: BUDGETTRACKER_TOKEN, HOMEBASE_TOKEN, …
services:
  budgettracker:
    host: 192.168.0.170
    port: 8080
    path: /mcp
    enabled: true
    # rmcp allows loopback Host only by default; required when host is a LAN IP.
    host_header: localhost

runtime:
  # SQLite + logs + weather cache live here. Relative paths resolve against cwd.
  # On the Linux box: point this at a mounted volume (e.g. /data) via config or MIMIR_DATA_DIR.
  data_dir: ./data
  log_level: INFO
  # Listen address for uvicorn (TUI auto-start reads this). Non-loopback requires
  # auth.mode: token + MIMIR_CLIENT_TOKEN. Pass the same --host/--port to uvicorn.
  host: 127.0.0.1
  port: 8000
