[project]
name = "mimir"
version = "0.1.0"
description = "Mimir — offline self-hosted personal assistant (FastAPI brain)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "textual>=1.0",
]

[project.scripts]
mimir = "clients.tui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
exe = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain", "clients"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
